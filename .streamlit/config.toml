# Tema visual de QUANTUM LAB. Las tres familias tipográficas vienen incluidas en Streamlit
# (funcionan sin Internet): títulos con serifa, texto sin serifa y cifras monoespaciadas.
[theme]
base = "dark"
primaryColor = "#42D9FF"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151F35"
textColor = "#F2F5FC"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
baseFontSize = 15
baseRadius = "small"
borderColor = "#263550"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0E1528"
secondaryBackgroundColor = "#151F35"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# headless = true es imprescindible: con false, Streamlit pregunta un correo por teclado la primera vez y,
# en un servidor (Streamlit Cloud), se queda esperando para siempre y la aplicación no arranca.
[server]
headless = true
